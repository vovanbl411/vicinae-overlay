name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pkgcheck
        uses: pkgcore/pkgcheck-action@v1
        with:
          args: gui-apps/vicinae

      - name: Test release decision logic
        run: |
          python3 -m unittest discover -s tests

      - name: Check patches and npm distfiles for every ebuild
        run: |
          shopt -s nullglob
          for ebuild in gui-apps/vicinae/vicinae-*.ebuild; do
            version=${ebuild##*/vicinae-}
            version=${version%.ebuild}
            source_dir="$RUNNER_TEMP/vicinae-$version"
            archive_url="https://github.com/vicinaehq/vicinae/archive/refs/tags"
            mkdir -p "$source_dir"
            curl --fail --location --silent \
              --show-error \
              "$archive_url/v$version.tar.gz" \
              | tar -xz --strip-components=1 -C "$source_dir"
            python3 scripts/prepare_stable_release.py \
              --check-source --ebuild "$ebuild" --source-dir "$source_dir"
            python3 scripts/check-npm-distfiles.py \
              --source-dir "$source_dir" --ebuild "$ebuild"
          done
