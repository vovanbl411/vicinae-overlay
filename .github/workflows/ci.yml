name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run pkgcheck
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --workdir /workspace \
            --entrypoint /usr/bin/bash \
            ghcr.io/pkgcore/pkgcheck@sha256:732a539ca77fefa211bc9dfb02bd99770cb8c3edfadac55767378353f59aeb2a \
            -euo pipefail -c '
              pmaint sync --import-masters .
              pmaint regen --dir ~/.cache/pkgcheck/repos .
              git config --global --add safe.directory /workspace
              pkgcheck --color y ci --failures /tmp/pkgcheck-failures.json \
                --exit GentooCI gui-apps/vicinae
            '

      - name: Test release decision logic
        run: |
          python3 -m unittest discover -s tests

      - name: Check patches and npm distfiles for every ebuild
        run: |
          shopt -s nullglob
          for ebuild in gui-apps/vicinae/vicinae-*.ebuild; do
            version=${ebuild##*/vicinae-}
            version=${version%.ebuild}
            source_dir="$RUNNER_TEMP/vicinae-$version"
            archive_url="https://github.com/vicinaehq/vicinae/archive/refs/tags"
            mkdir -p "$source_dir"
            curl --fail --location --silent \
              --show-error \
              "$archive_url/v$version.tar.gz" \
              | tar -xz --strip-components=1 -C "$source_dir"
            python3 scripts/prepare_stable_release.py \
              --check-source --ebuild "$ebuild" --source-dir "$source_dir"
            python3 scripts/check-npm-distfiles.py \
              --source-dir "$source_dir" --ebuild "$ebuild"
          done
